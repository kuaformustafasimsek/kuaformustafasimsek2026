<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaför Mustafa Şimşek</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Gelasio:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
        }
        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .logo-container {
            width: 85%;
            max-width: 420px;
            height: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
           
        }
        .logo-svg .svg-elem-1 {
            /* FILL: neon pembe, başlangıçta görünmez */
            fill: #CF0F47;
            fill-opacity: 0;

            /* STROKE: parlak pembe/beyaz hat */
            stroke: #00000;
            stroke-width: 1.8px;
            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: var(--path-length);
            stroke-dashoffset: var(--path-length);
        }

        /* Stroke çizilirken fill de aynı anda doluyor */
        @keyframes drawStroke {
            to { stroke-dashoffset: 0; }
        }
        @keyframes fillIn {
            0%   { fill-opacity: 0; }
            100% { fill-opacity: 1; }
        }

        .logo-svg.animating .svg-elem-1 {
            animation: 
                drawStroke 5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                fillIn    3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Neon Başlık */
        .neon-title {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff, 0 0 15px #00ffff, 0 0 30px #00ffff;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .neon-title.show { opacity: 1; }

        /* Butonlar */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 35px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
        }
        .buttons-container.show {
            opacity: 1;
            transform: translateY(0);
        }
        .neon-btn {
            padding: 14px 40px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            border: 2px solid;
            border-radius: 3px;
            cursor: pointer;
            background: transparent;
            transition: all 0.3s ease;
            font-weight: 500;
            min-width: 260px;
        }
        .neon-btn.pink {
            color: #FF0B55;
            border-color: #FF0B55;
            box-shadow: 0 0 5px rgba(255,0,255,0.3), inset 0 0 5px rgba(255,0,255,0.1);
            
        }
        .neon-btn.pink:hover {
            background: rgba(255,0,255,0.1);
            box-shadow: 0 0 15px rgba(255,0,255,0.5), 0 0 30px rgba(255,0,255,0.3), inset 0 0 10px rgba(255,0,255,0.2);
            transform: translateY(-2px);
        }
        .neon-btn.cyan {
            color: #FF0B55;
            border-color: #FF0B55;
            box-shadow: 0 0 5px rgba(0,255,255,0.3), inset 0 0 5px rgba(0,255,255,0.1);          
        }
        .neon-btn.cyan:hover {
             background: rgba(255,0,255,0.1);
            box-shadow: 0 0 15px rgba(255,0,255,0.5), 0 0 30px rgba(255,0,255,0.3), inset 0 0 10px rgba(255,0,255,0.2);
            transform: translateY(-2px);
        }

        /* Loading */
        .loading-bar {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: #111;
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-bar::after {
            content: '';
            position: absolute;
            left: 0; top: 0;
            height: 100%; width: 0%;
            background: #FF0B55;
            box-shadow: 0 0 8px #FF0B55;
            border-radius: 2px;
            animation: loadProgress 5s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        @keyframes loadProgress {
            0% { width: 0%; }
            70% { width: 90%; }
            100% { width: 100%; }
        }

        /* Ana içerik */
        #main-content {
            display: none;
            min-height: 100vh;
            background: #000;
            color: #fff;
            padding: 40px 20px;
            text-align: center;
        }
        #main-content.visible {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 480px) {
            .logo-container { max-width: 300px; }
            .neon-title { font-size: 15px; letter-spacing: 3px; }
            .neon-btn { min-width: 200px; padding: 12px 30px; font-size: 12px; }
        }
    </style>
<base target="_blank">

    <script>
        (function() {
            const svg = document.querySelector('.logo-svg');
            const path = document.querySelector('.svg-elem-1');
            const title = document.getElementById('neon-title');
            const buttons = document.getElementById('buttons-container');
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');

            const pathLength = path.getTotalLength();
            path.style.setProperty('--path-length', pathLength);

            // Animasyonu başlat
            setTimeout(() => { svg.classList.add('animating'); }, 300);

            // Başlık ve butonlar
            setTimeout(() => { title.classList.add('show'); }, 4300);
            setTimeout(() => { buttons.classList.add('show'); }, 4800);

            window.goToSite = function() {
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.style.display = 'none';
                    main.classList.add('visible');
                }, 1000);
            };
        })();
    </script>
